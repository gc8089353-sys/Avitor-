<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrier Landing</title>
<style>
  body {
    margin: 0;
    padding: 12px;
    background: #0b1a2e;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 10px 0; }
  .wallet { font-size: 18px; margin-bottom: 10px; }
  .wallet b { color: #ffcd6b; }
  canvas {
    width: 100%;
    height: auto;
    background: #1c3f5c;
    border: 2px solid #294b63;
    border-radius: 12px;
    display: block;
    touch-action: manipulation;
  }
  .info {
    margin: 10px 0;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
  }
  button {
    width: 100%;
    padding: 18px;
    margin: 6px 0;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    color: #fff;
    background: #294a63;
    cursor: pointer;
  }
  #payBtn { background: #c99b3b; color: #1d160a; }
  #playBtn { background: #2e7d32; }
  #resetBtn { background: #4a5568; }
  button:disabled { opacity: 0.4; }
  #errorBox {
    background: #4a0f0f;
    color: #ffb3b3;
    padding: 10px;
    border-radius: 8px;
    margin: 10px 0;
    font-size: 13px;
    white-space: pre-wrap;
    display: none;
  }
  #logBox {
    background: #000;
    color: #0f0;
    padding: 8px;
    border-radius: 8px;
    margin: 10px 0;
    font-size: 12px;
    font-family: monospace;
    max-height: 120px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<h1>🛩️ CARRIER LANDING</h1>
<div class="wallet">⛁ Credits: <b id="credits">100</b></div>

<canvas id="cv" width="720" height="360"></canvas>

<div class="info">
  <div id="msg">Loading...</div>
  <div>🛬 <b id="landings">0</b> &nbsp; 💥 <b id="crashes">0</b></div>
</div>

<button id="payBtn">💰 PAY 20¢</button>
<button id="playBtn">▶ PLAY (20¢)</button>
<button id="resetBtn">🔄 RESET</button>

<div id="errorBox"></div>
<div id="logBox">Log:</div>

<script>
// Error catcher
window.onerror = function(m, s, l, c, e) {
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'ERROR: ' + m + '\nLine: ' + l;
  return false;
};

function log(t) {
  var b = document.getElementById('logBox');
  b.textContent += '\n' + t;
}

try {
  log('Script starting...');

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 360;

  log('Canvas found: ' + (canvas ? 'yes' : 'no'));
  log('Context: ' + (ctx ? 'yes' : 'no'));

  // ---- STATE ----
  var credits = 100;
  var landings = 0;
  var crashes = 0;
  var flying = false;

  var plane = { x: 100, y: 150, vy: 0, angle: 0 };
  var carrier = { x: 540, y: 290, w: 120, h: 16 };
  var GRAVITY = 0.13;
  var LIFT = -1.2;
  var SPEED_X = 2.0;
  var MIN_VY = -3.0;
  var MAX_VY = 2.5;

  var creditsEl = document.getElementById('credits');
  var landingsEl = document.getElementById('landings');
  var crashesEl = document.getElementById('crashes');
  var msgEl = document.getElementById('msg');
  var payBtn = document.getElementById('payBtn');
  var playBtn = document.getElementById('playBtn');
  var resetBtn = document.getElementById('resetBtn');

  log('DOM elements grabbed');

  function refreshUI() {
    creditsEl.textContent = credits;
    landingsEl.textContent = landings;
    crashesEl.textContent = crashes;
    playBtn.disabled = !(credits >= 20 && !flying);
  }

  function setMsg(t) { msgEl.textContent = t; log('MSG: ' + t); }

  function resetPlane() {
    plane.x = 100; plane.y = 150; plane.vy = 0; plane.angle = 0;
  }

  function startGame() {
    log('startGame called. flying=' + flying + ' credits=' + credits);
    if (flying) return;
    if (credits < 20) { setMsg('Not enough credits'); return; }
    credits = credits - 20;
    resetPlane();
    flying = true;
    setMsg('FLYING — tap canvas to lift!');
    refreshUI();
  }

  function crash(reason) {
    if (!flying) return;
    flying = false;
    crashes = crashes + 1;
    setMsg('CRASH: ' + reason);
    refreshUI();
  }

  function landed() {
    if (!flying) return;
    flying = false;
    landings = landings + 1;
    setMsg('LANDED! +1');
    plane.y = carrier.y - 12;
    plane.vy = 0;
    plane.angle = 0;
    refreshUI();
  }

  function checkLanding() {
    if (!flying) return;
    if (plane.x < 5) { crash('off left'); return; }
    if (plane.x > W - 5) { crash('off right'); return; }

    var onDeckX = (plane.x >= carrier.x && plane.x <= carrier.x + carrier.w);
    var nearDeckY = (plane.y >= carrier.y - 12 && plane.y <= carrier.y + 10);

    if (onDeckX && nearDeckY) {
      if (plane.vy >= MIN_VY && plane.vy <= MAX_VY) landed();
      else crash(plane.vy < MIN_VY ? 'too steep' : 'too fast');
      return;
    }

    if (plane.y >= 320) {
      if (onDeckX && plane.vy >= MIN_VY && plane.vy <= MAX_VY) landed();
      else if (onDeckX) crash('hard landing');
      else crash('splashdown');
    }
  }

  function update() {
    if (!flying) return;
    plane.vy += GRAVITY;
    if (plane.vy > 5) plane.vy = 5;
    if (plane.vy < -5) plane.vy = -5;
    plane.y += plane.vy;
    plane.angle = plane.vy * 0.08;
    if (plane.angle > 0.3) plane.angle = 0.3;
    if (plane.angle < -0.3) plane.angle = -0.3;
    plane.x += SPEED_X;
    checkLanding();
  }

  function draw() {
    // sky
    ctx.fillStyle = '#2b5b7a';
    ctx.fillRect(0, 0, W, 320);
    // sea
    ctx.fillStyle = '#123a52';
    ctx.fillRect(0, 320, W, 40);
    // carrier
    ctx.fillStyle = '#3a4e5e';
    ctx.fillRect(carrier.x, carrier.y, carrier.w, carrier.h);
    ctx.fillStyle = '#f0e68c';
    ctx.fillRect(carrier.x + 8, carrier.y - 2, 22, 4);
    ctx.fillRect(carrier.x + 85, carrier.y - 2, 22, 4);
    ctx.fillStyle = '#4b3a2b';
    ctx.fillRect(carrier.x + 88, carrier.y - 24, 20, 24);
    // plane
    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(plane.angle);
    ctx.fillStyle = '#d9e9ff';
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-12, -8);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-12, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#90a8c0';
    ctx.fillRect(-8, -10, 16, 4);
    ctx.fillRect(-8, 6, 16, 4);
    ctx.restore();

    // overlay when not flying
    if (!flying) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('PAY 20¢ TO FLY', W/2, H/2);
      ctx.textAlign = 'start';
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---- CONTROLS ----
  function lift(e) {
    if (e) e.preventDefault();
    if (!flying) return;
    plane.vy += LIFT;
    if (plane.vy < -4.5) plane.vy = -4.5;
  }

  window.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); lift(); }
  });
  canvas.addEventListener('mousedown', lift);
  canvas.addEventListener('touchstart', lift, { passive: false });

  // ---- BUTTONS (using onclick for maximum compatibility) ----
  payBtn.onclick = function() {
    log('PAY clicked');
    credits += 20;
    setMsg('+20 credits');
    refreshUI();
  };

  playBtn.onclick = function() {
    log('PLAY clicked');
    startGame();
  };

  resetBtn.onclick = function() {
    log('RESET clicked');
    flying = false;
    landings = 0;
    crashes = 0;
    resetPlane();
    setMsg('Reset done');
    refreshUI();
  };

  // ---- START ----
  log('Buttons wired up');
  resetPlane();
  refreshUI();
  setMsg('Ready — tap PAY');
  loop();

  log('Script loaded successfully');

} catch(err) {
  var box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'CAUGHT ERROR: ' + err.message + '\n' + err.stack;
}
</script>

</body>
</html>
